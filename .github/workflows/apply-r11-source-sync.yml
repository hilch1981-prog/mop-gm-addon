name: Apply R11 source sync

on:
  push:
    branches:
      - ai/chatgpt/r11-source-sync
    paths:
      - '.r11-sync/READY'

permissions:
  contents: read

jobs:
  apply-r11:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Archive current main addon baseline
        shell: bash
        run: |
          set -euo pipefail
          tar -cJf /tmp/current-main-addon.tar.xz AzerothAdmin
          sha256sum /tmp/current-main-addon.tar.xz
          find AzerothAdmin -type f | sort > /tmp/current-main-files.txt
          printf 'current_main_files='
          wc -l < /tmp/current-main-files.txt
      - name: Upload current main addon baseline
        uses: actions/upload-artifact@v4
        with:
          name: current-main-addon-baseline
          path: |
            /tmp/current-main-addon.tar.xz
            /tmp/current-main-files.txt
          if-no-files-found: error
          retention-days: 7
