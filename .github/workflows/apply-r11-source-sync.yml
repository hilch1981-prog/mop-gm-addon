          : > /tmp/missing.txt
          while read -r sha size path; do
            if git cat-file -e "${sha}^{blob}" 2>/dev/null; then
              printf '%s %s %s\n' "$sha" "$size" "$path" >> /tmp/found.txt
            else
              printf '%s %s %s\n' "$sha" "$size" "$path" >> /tmp/missing.txt
            fi
          done < /tmp/r7-blobs.txt
          printf 'found='; wc -l < /tmp/found.txt
          printf 'missing='; wc -l < /tmp/missing.txt
          printf 'missing_bytes='; awk '{s+=$2} END{print s+0}' /tmp/missing.txt
          echo '--- MISSING R7 BLOBS ---'
          cat /tmp/missing.txt
