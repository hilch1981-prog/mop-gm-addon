name: Apply R11 source sync

on:
  push:
    branches:
      - ai/chatgpt/r11-source-sync
    paths:
      - '.r11-sync/READY'

permissions:
  contents: write

jobs:
  apply-r11:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sync branch
        uses: actions/checkout@v4
        with:
          ref: ai/chatgpt/r11-source-sync
          fetch-depth: 0

      - name: Restore packaged canonical R7 addon baseline
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(tools/seeds/r7-source-overlay.tar.xz.b64.part-*)
          test "${#parts[@]}" -gt 0
          printf 'R7 seed parts: %s\n' "${#parts[@]}"
          cat "${parts[@]}" > /tmp/r7-source-overlay.tar.xz.b64
          base64 -d /tmp/r7-source-overlay.tar.xz.b64 > /tmp/r7-source-overlay.tar.xz
          xz -t /tmp/r7-source-overlay.tar.xz
          mkdir -p /tmp/r7-overlay
          tar -xJf /tmp/r7-source-overlay.tar.xz -C /tmp/r7-overlay
          r7_toc="$(find /tmp/r7-overlay -type f -path '*/AzerothAdmin/AzerothAdmin.toc' -print -quit)"
          test -n "$r7_toc"
          r7_addon="$(dirname "$r7_toc")"
          echo "Restoring R7 addon from: $r7_addon"
          rm -rf AzerothAdmin
          cp -a "$r7_addon" AzerothAdmin
          test -f AzerothAdmin/AzerothAdmin.toc
          test -f AzerothAdmin/AzerothAdmin.lua
          test -f AzerothAdmin/Data/MoP/SourceInfo.lua
          test -f AzerothAdmin/Locale/Locale.lua
          test -f AzerothAdmin/Modules/Commands.lua
          printf 'R7 baseline files: '
          find AzerothAdmin -type f | wc -l

      - name: Reconstruct verified R7 to R11 patch
        run: |
          set -euo pipefail
          cat .r11-sync/patch.part-*.b64 > /tmp/r11.patch.xz.b64
          base64 -d /tmp/r11.patch.xz.b64 > /tmp/r11.patch.xz
          echo '45d0f9ab4865ca2a1072848f95d09b03e8a896c915d4e26c3c78a0be57548e6c  /tmp/r11.patch.xz' | sha256sum -c -
          xz -t /tmp/r11.patch.xz
          xz -dc /tmp/r11.patch.xz > /tmp/r11.patch

      - name: Verify and apply exact R11 game-test source patch
        run: |
          set -euo pipefail
          patch --dry-run -p1 < /tmp/r11.patch
          patch -p1 < /tmp/r11.patch

      - name: Validate R11 package contract
        run: |
          set -euo pipefail
          grep -F '## Interface: 50400' AzerothAdmin/AzerothAdmin.toc
          grep -F '## Version: 3.5.0-548-r11-battlepet-rc11' AzerothAdmin/AzerothAdmin.toc
          grep -F 'Modules\Integrations\BattlePetDeathPicker.lua' AzerothAdmin/AzerothAdmin.toc
          test -f AzerothAdmin/Modules/Integrations/BattlePetDeathPicker.lua
          test -f AzerothAdmin/Data/MoP/AreaTableLocalizationAudit.json
          test "$(find AzerothAdmin -type f | wc -l)" -eq 86
          cd AzerothAdmin
          sha256sum -c FILE_MANIFEST.sha256
          test "$(wc -l < FILE_MANIFEST.sha256)" -eq 85

      - name: Parse every TOC Lua file with Lua 5.1
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y lua5.1 >/dev/null
          python3 - <<'PY' > /tmp/toc-lua.txt
          from pathlib import Path
          addon = Path('AzerothAdmin')
          for raw in (addon / 'AzerothAdmin.toc').read_text(encoding='utf-8').splitlines():
              line = raw.strip()
              if line and not line.startswith('##') and line.lower().endswith('.lua'):
                  print(addon / line.replace('\\', '/'))
          PY
          test "$(wc -l < /tmp/toc-lua.txt)" -eq 64
          while IFS= read -r file; do luac5.1 -p "$file"; done < /tmp/toc-lua.txt

      - name: Build verified R11 game-test ZIP
        run: |
          set -euo pipefail
          rm -f AzerothAdmin_3.5.0-548-r11-GAME-TEST-FULL.zip
          zip -qr AzerothAdmin_3.5.0-548-r11-GAME-TEST-FULL.zip AzerothAdmin
          echo '8a452840a5fffbe57bd2664b067c448bd6efabfc3c1216c1d798515359fd1090  AzerothAdmin_3.5.0-548-r11-GAME-TEST-FULL.zip' | sha256sum -c -

      - name: Commit synchronized R11 source
        run: |
          set -euo pipefail
          rm -rf .r11-sync
          rm -f .github/workflows/apply-r11-source-sync.yml
          git config user.name 'Hobbyist'
          git config user.email 'hilch1981@gmail.com'
          git add -A AzerothAdmin .r11-sync .github/workflows/apply-r11-source-sync.yml || true
          git commit -m 'Sync R11 full game-test source'
          git push origin HEAD:ai/chatgpt/r11-source-sync
