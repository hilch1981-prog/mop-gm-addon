name: Apply R11 source sync

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - '.r11-sync/READY'

permissions:
  contents: read

jobs:
  apply-r11:
    if: github.event.pull_request.head.ref == 'ai/chatgpt/r11-source-sync'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sync branch
        uses: actions/checkout@v4
        with:
          ref: ai/chatgpt/r11-source-sync
          fetch-depth: 0
      - name: Archive current addon source
        run: |
          set -euo pipefail
          tar -cJf AzerothAdmin-current.tar.xz AzerothAdmin
          sha256sum AzerothAdmin-current.tar.xz > AzerothAdmin-current.tar.xz.sha256
      - name: Upload current addon snapshot
        uses: actions/upload-artifact@v4
        with:
          name: r11-pr-current-addon-snapshot
          path: |
            AzerothAdmin-current.tar.xz
            AzerothAdmin-current.tar.xz.sha256
          if-no-files-found: error
          retention-days: 7
