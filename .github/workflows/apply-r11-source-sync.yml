name: Apply R11 source sync

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - '.r11-sync/READY'

permissions:
  contents: read

jobs:
  apply-r11:
    if: github.event.pull_request.head.ref == 'ai/chatgpt/r11-source-sync'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sync branch
        uses: actions/checkout@v4
        with:
          ref: ai/chatgpt/r11-source-sync
          fetch-depth: 0

      - name: Probe retained v1 delta integrity
        run: |
          set -euo pipefail
          git fetch origin release/v1.0.0-stable:refs/remotes/origin/release/v1.0.0-stable
          rm -f /tmp/v1-delta.tar.xz
          for n in 000 001 002 003; do
            git show "origin/release/v1.0.0-stable:.release-seed/v1-delta.part-${n}" > "/tmp/part-${n}"
            printf 'part-%s bytes=' "$n"
            wc -c < "/tmp/part-${n}"
            sha256sum "/tmp/part-${n}"
            cat "/tmp/part-${n}" >> /tmp/v1-delta.tar.xz
          done
          echo 'combined:'
          wc -c /tmp/v1-delta.tar.xz
          sha256sum /tmp/v1-delta.tar.xz
          file /tmp/v1-delta.tar.xz
          xz -t /tmp/v1-delta.tar.xz
          tar -tJf /tmp/v1-delta.tar.xz | tee /tmp/v1-delta-files.txt
          printf 'entries='
          wc -l < /tmp/v1-delta-files.txt

      - name: Archive current addon source
        run: |
          set -euo pipefail
          tar -cJf AzerothAdmin-current.tar.xz AzerothAdmin
          sha256sum AzerothAdmin-current.tar.xz > AzerothAdmin-current.tar.xz.sha256

      - name: Upload current addon snapshot
        uses: actions/upload-artifact@v4
        with:
          name: r11-pr-current-addon-snapshot
          path: |
            AzerothAdmin-current.tar.xz
            AzerothAdmin-current.tar.xz.sha256
          if-no-files-found: error
          retention-days: 7
