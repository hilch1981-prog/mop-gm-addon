name: Apply R11 source sync

on:
  push:
    branches:
      - ai/chatgpt/r11-source-sync
    paths:
      - '.r11-sync/READY'

permissions:
  contents: read

jobs:
  apply-r11:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sync branch
        uses: actions/checkout@v4
        with:
          ref: ai/chatgpt/r11-source-sync
          fetch-depth: 0
      - name: Print committed R7 addon blob manifest
        shell: bash
        run: |
          set -euo pipefail
          r7='d9e7d68551726fb71957e06b50dc039ee63bd511'
          git ls-tree -r "$r7" AzerothAdmin | tee /tmp/r7-tree.txt
          printf 'r7_committed_files='
          wc -l < /tmp/r7-tree.txt
