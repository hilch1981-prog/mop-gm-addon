name: Test R10 Drive download
on:
  push:
    branches: [test-drive-download]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Download R10 with gdown
        run: |
          set -euxo pipefail
          python -m pip install --quiet gdown
          gdown '1PfqXo9cM6ZBbGBwYBXqFhykDYD61FaPM' -O /tmp/r10.zip
          ls -l /tmp/r10.zip
          sha256sum /tmp/r10.zip
          echo 'b7e47b0eaff6a423efd3d176835c6bd969aecca4c88dd8da3526566cad7c8d0c  /tmp/r10.zip' | sha256sum -c -
          unzip -tq /tmp/r10.zip
