name: Addon static checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skip bootstrap transport commit
        id: gate
        run: |
          if [[ -f .release-bootstrap/r10-source.part-00 ]]; then echo 'ready=false' >> "$GITHUB_OUTPUT"; else echo 'ready=true' >> "$GITHUB_OUTPUT"; fi
      - name: Install Lua 5.1
        if: steps.gate.outputs.ready == 'true'
        run: sudo apt-get update >/dev/null && sudo apt-get install -y lua5.1 >/dev/null
      - name: Verify stable source
        if: steps.gate.outputs.ready == 'true'
        run: |
          grep -F '## Interface: 50400' AzerothAdmin/AzerothAdmin.toc
          grep -F '## Version: 1.0.0' AzerothAdmin/AzerothAdmin.toc
          grep -F '## X-Release-Channel: stable' AzerothAdmin/AzerothAdmin.toc
          python - <<'PY'
          from pathlib import Path
          import re
          root=Path('AzerothAdmin'); toc=(root/'AzerothAdmin.toc').read_text(encoding='utf-8')
          paths=[x.strip() for x in toc.splitlines() if x.strip() and not x.startswith('##')]
          assert len(paths)==63,len(paths)
          for rel in paths: assert (root/rel.replace('\\','/')).is_file(),rel
          def count(rel,pat):
              rx=re.compile(pat); return sum(1 for line in (root/rel).open(encoding='utf-8') if rx.search(line))
          assert count('Data/Generated/Items.lua',r'^\s*\{\d+,')==80072
          assert count('Data/Generated/Quests.lua',r'^\s*\{\d+,')==18144
          assert count('Data/Generated/Creatures.lua',r'^\s*\{\d+,')==57526
          assert count('Data/Generated/Teleports.lua',r'^\s*\{\d+,')==1602
          assert count('Data/MoP/ProfessionDetails.lua',r'^\s*\[\d+\]\s*=')==5129
          print('STATIC_DATA_PASS')
          PY
      - name: Parse every TOC Lua file as Lua 5.1
        if: steps.gate.outputs.ready == 'true'
        run: |
          python - <<'PY' > /tmp/toc-lua.txt
          from pathlib import Path
          root=Path('AzerothAdmin')
          for raw in (root/'AzerothAdmin.toc').read_text(encoding='utf-8').splitlines():
              line=raw.strip()
              if line and not line.startswith('##') and line.lower().endswith('.lua'): print(root/line.replace('\\','/'))
          PY
          while IFS= read -r file; do luac5.1 -p "$file"; done < /tmp/toc-lua.txt
