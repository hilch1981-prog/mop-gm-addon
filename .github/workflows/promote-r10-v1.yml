name: Promote R10 v1 source

on:
  push:
    branches:
      - ai/chatgpt/release-v1.0.0
    paths:
      - '.release-bootstrap/**'
      - '.github/workflows/promote-r10-v1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check bootstrap payload
        id: gate
        run: |
          if test -f .release-bootstrap/r10-source.part-00; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Reconstruct R10 source
        if: steps.gate.outputs.ready == 'true'
        run: |
          cat .release-bootstrap/r10-source.part-* > /tmp/r10-source.zip
          echo "8f76b9fc66eda0692df43219b70cc2611ee6f6952dcaa0890cba3c2aa72c5e58  /tmp/r10-source.zip" | sha256sum -c -
          rm -rf AzerothAdmin
          unzip -q /tmp/r10-source.zip -d .
          test -f AzerothAdmin/AzerothAdmin.toc
      - name: Promote metadata
        if: steps.gate.outputs.ready == 'true'
        run: python tools/promote_r10_v1.py
      - name: Install Lua 5.1
        if: steps.gate.outputs.ready == 'true'
        run: sudo apt-get update >/dev/null && sudo apt-get install -y lua5.1 >/dev/null
      - name: Verify source and Lua syntax
        if: steps.gate.outputs.ready == 'true'
        run: |
          grep -F '## Interface: 50400' AzerothAdmin/AzerothAdmin.toc
          grep -F '## Version: 1.0.0' AzerothAdmin/AzerothAdmin.toc
          grep -F '## X-Release-Channel: stable' AzerothAdmin/AzerothAdmin.toc
          grep -F '## X-Release-Tag: v1.0.0' AzerothAdmin/AzerothAdmin.toc
          python -c "from pathlib import Path; r=Path('AzerothAdmin'); t=(r/'AzerothAdmin.toc').read_text(encoding='utf-8'); p=[x.strip() for x in t.splitlines() if x.strip() and not x.startswith('##')]; assert len(p)==63; assert all((r/x.replace('\\\\','/')).is_file() for x in p); print('TOC_PATH_PASS',len(p))"
          find AzerothAdmin -name '*.lua' -type f -print0 | sort -z | xargs -0 -n1 luac5.1 -p
      - name: Package stable candidate
        if: steps.gate.outputs.ready == 'true'
        run: |
          mkdir -p dist
          zip -0 -q -r dist/AzerothAdmin_MoP_5.4.8_v1.0.0_FULL.zip AzerothAdmin
          test "$(stat -c%s dist/AzerothAdmin_MoP_5.4.8_v1.0.0_FULL.zip)" -gt 16000000
          sha256sum dist/AzerothAdmin_MoP_5.4.8_v1.0.0_FULL.zip > dist/AzerothAdmin_MoP_5.4.8_v1.0.0_FULL.zip.sha256
          unzip -tq dist/AzerothAdmin_MoP_5.4.8_v1.0.0_FULL.zip
      - name: Upload candidate
        if: steps.gate.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: AzerothAdmin-MoP-5.4.8-v1.0.0
          path: |
            dist/AzerothAdmin_MoP_5.4.8_v1.0.0_FULL.zip
            dist/AzerothAdmin_MoP_5.4.8_v1.0.0_FULL.zip.sha256
            docs/releases/v1.0.0/RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 90
      - name: Commit verified v1 source
        if: steps.gate.outputs.ready == 'true'
        run: |
          rm -rf .release-bootstrap
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Promote R10 game-tested candidate to v1.0.0 stable'
          git push origin HEAD:ai/chatgpt/release-v1.0.0
