name: Verify exact R7 seed chunks

on:
  push:
    branches:
      - ai/chatgpt/r11-source-sync
    paths:
      - '.r11-sync/**'
      - '.github/workflows/verify-r7-seed.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify chunk hashes and reconstruct seed
        shell: bash
        run: |
          set -euo pipefail
          bad=0
          while read -r name sha size; do
            path=".r11-sync/$name"
            if [ ! -f "$path" ]; then
              echo "MISSING $name"
              bad=1
              continue
            fi
            got_size=$(wc -c < "$path")
            got_sha=$(git hash-object "$path")
            if [ "$got_size" != "$size" ]; then
              echo "SIZE_MISMATCH $name got=$got_size expected=$size"
              bad=1
            fi
            if [ "$got_sha" != "$sha" ]; then
              echo "SHA_MISMATCH $name got=$got_sha expected=$sha"
              bad=1
            fi
          done < .r11-sync/r7seed-parts.manifest
          [ "$bad" = 0 ] || exit 1

          cat .r11-sync/r7seed.part-*.b64 | base64 -d > /tmp/r7-seed.tar.xz
          echo 'db04e41dedd5268aa8823ba4fd9f52a986a2ceeb9bc115bf3767a059caf53406  /tmp/r7-seed.tar.xz' | sha256sum -c -
          test "$(wc -c < /tmp/r7-seed.tar.xz)" = "259348"
          xz -t /tmp/r7-seed.tar.xz
          echo 'R7_SEED_VERIFY_PASS'
