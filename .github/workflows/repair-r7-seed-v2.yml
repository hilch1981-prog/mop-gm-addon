name: Repair exact R7 seed chunks v2

on:
  workflow_dispatch:
  push:
    branches: [ai/chatgpt/r11-source-sync]
    paths:
      - '.r11-sync/REPAIR_V2_TRIGGER*'
      - '.github/workflows/repair-r7-seed-v2.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Recover exact blobs by SHA, then repair small transfer errors
        shell: bash
        run: |
          set -euo pipefail
          changed=0
          while read -r name sha size; do
            p=".r11-sync/r7seed.$name"
            if [ -f "$p" ] && [ "$(wc -c < "$p")" = "$size" ] && [ "$(git hash-object "$p")" = "$sha" ]; then
              continue
            fi
            tmp="/tmp/$name.exact"
            if gh api "repos/$GITHUB_REPOSITORY/git/blobs/$sha" --jq '.content' 2>/dev/null | tr -d '\n' | base64 -d > "$tmp" 2>/dev/null; then
              if [ "$(wc -c < "$tmp")" = "$size" ] && [ "$(git hash-object "$tmp")" = "$sha" ]; then
                cp "$tmp" "$p"
                echo "RECOVERED_BY_BLOB_SHA $name"
                changed=1
              fi
            fi
          done < .r11-sync/r7seed-parts.manifest

          python3 - <<'PY'
          from pathlib import Path
          import hashlib, string
          root=Path('.r11-sync')
          alpha=(string.ascii_letters+string.digits+'+/=').encode()
          def gsha(d): return hashlib.sha1(b'blob '+str(len(d)).encode()+b'\0'+d).hexdigest()
          rows=[line.split() for line in (root/'r7seed-parts.manifest').read_text().splitlines()]
          unresolved=[]
          for name,target,sz in rows:
              want=int(sz); p=root/('r7seed.'+name)
              if not p.exists(): unresolved.append((name,'missing')); continue
              d=p.read_bytes()
              if len(d)==want and gsha(d)==target: continue
              fixed=None
              delta=len(d)-want
              if 0 < delta <= 32:
                  for pos in range(len(d)-delta+1):
                      c=d[:pos]+d[pos+delta:]
                      if gsha(c)==target: fixed=c; break
              if fixed is None and len(d)==want:
                  b=bytearray(d)
                  for pos,old in enumerate(d):
                      for ch in alpha:
                          if ch==old: continue
                          b[pos]=ch
                          c=bytes(b)
                          if gsha(c)==target: fixed=c; break
                      b[pos]=old
                      if fixed is not None: break
              if fixed is None and want-len(d)==1:
                  for pos in range(len(d)+1):
                      for ch in alpha:
                          c=d[:pos]+bytes([ch])+d[pos:]
                          if gsha(c)==target: fixed=c; break
                      if fixed is not None: break
              if fixed is not None:
                  p.write_bytes(fixed); print('REPAIRED_SMALL_ERROR',name)
              else:
                  unresolved.append((name,f'size={len(d)} sha={gsha(d)} target={target}'))
          report=root/'SEED_REPAIR_REPORT.txt'
          if unresolved:
              report.write_text('\n'.join(' '.join(x) for x in unresolved)+'\n')
          elif report.exists():
              report.unlink()
          PY

          bad=0
          while read -r name sha size; do
            p=".r11-sync/r7seed.$name"
            if [ ! -f "$p" ] || [ "$(wc -c < "$p")" != "$size" ] || [ "$(git hash-object "$p")" != "$sha" ]; then bad=1; fi
          done < .r11-sync/r7seed-parts.manifest

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ "$bad" != 0 ]; then
            rm -f .r11-sync/SEED_VERIFIED
            git add .r11-sync/r7seed.part-*.b64 .r11-sync/SEED_REPAIR_REPORT.txt || true
            if ! git diff --cached --quiet; then git commit -m 'Recover available exact R7 seed blobs'; git push origin HEAD:ai/chatgpt/r11-source-sync; fi
            echo 'R7 seed still has unresolved chunks'
            exit 2
          fi

          cat .r11-sync/r7seed.part-*.b64 | base64 -d > /tmp/r7-seed.tar.xz
          echo 'db04e41dedd5268aa8823ba4fd9f52a986a2ceeb9bc115bf3767a059caf53406  /tmp/r7-seed.tar.xz' | sha256sum -c -
          test "$(wc -c < /tmp/r7-seed.tar.xz)" = 259348
          xz -t /tmp/r7-seed.tar.xz
          printf '%s\n' 'sha256=db04e41dedd5268aa8823ba4fd9f52a986a2ceeb9bc115bf3767a059caf53406' 'size=259348' 'xz=PASS' > .r11-sync/SEED_VERIFIED
          rm -f .r11-sync/SEED_REPAIR_REPORT.txt
          git add .r11-sync/r7seed.part-*.b64 .r11-sync/SEED_VERIFIED .r11-sync/SEED_REPAIR_REPORT.txt || true
          if ! git diff --cached --quiet; then git commit -m 'Verify exact R7 source seed'; git push origin HEAD:ai/chatgpt/r11-source-sync; fi
