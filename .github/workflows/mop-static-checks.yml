name: MoP Addon Static Checks

on:
  push:
    branches: [ main, feature/mop-full-port, feature/chipa-sql-data-browser ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1 zip
      - name: Validate project structure and MoP metadata
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 tools/validate_mop_addon.py
      - name: Parse all runtime Lua files
        run: |
          while IFS= read -r file; do
            luac5.1 -p "$file"
          done < <(find AzerothAdminMoP -name '*.lua' -type f | sort)
      - name: Package addon
        run: zip -r AzerothAdminMoP-1.1.0-rc1.zip AzerothAdminMoP
      - name: Upload installable ZIP
        uses: actions/upload-artifact@v7
        with:
          name: AzerothAdminMoP-1.1.0-rc1
          path: AzerothAdminMoP-1.1.0-rc1.zip
          if-no-files-found: error
