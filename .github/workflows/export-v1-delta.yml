name: Export v1 delta source snapshot

on:
  push:
    branches:
      - ai/chatgpt/r11-source-sync
    paths:
      - '.github/workflows/export-v1-delta.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect retained v1 delta chunks
        run: |
          set -euo pipefail
          git fetch origin release/v1.0.0-stable:refs/remotes/origin/release/v1.0.0-stable
          mkdir -p /tmp/v1-seed
          for n in 000 001 002 003; do
            git show "origin/release/v1.0.0-stable:.release-seed/v1-delta.part-${n}" > "/tmp/v1-seed/part-${n}"
            echo "--- part-${n} ---"
            wc -c "/tmp/v1-seed/part-${n}"
            file "/tmp/v1-seed/part-${n}" || true
            xxd -l 32 "/tmp/v1-seed/part-${n}" || true
            sha256sum "/tmp/v1-seed/part-${n}"
          done
          cat /tmp/v1-seed/part-* > /tmp/v1-delta.bin
          echo '--- concatenated ---'
          wc -c /tmp/v1-delta.bin
          file /tmp/v1-delta.bin || true
          xxd -l 64 /tmp/v1-delta.bin || true
          sha256sum /tmp/v1-delta.bin
